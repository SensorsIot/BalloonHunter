name: BalloonHunter Android Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/deploy.yml'
    tags: [ 'v*' ]

jobs:
  # STEP 1: Build for your Pixel phone
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: android/*.gradle*

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK for Pixel
        uses: actions/upload-artifact@v4
        with:
          name: BalloonHunter-Pixel-Install
          path: android/app/build/outputs/apk/debug/*.apk

  # STEP 2: Deploy to Play Store (only on version tags)
  deploy_production:
    name: Play Store Release
    needs: build_debug
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release Bundle (AAB)
        run: ./gradlew bundleRelease

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.balloonhunter.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
