name: iOS tests

# The suite is the only gate this project has. It runs on every change to the app
# and on every pull request, so a broken test blocks the merge rather than waiting
# for someone to run it locally.
on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
  workflow_dispatch:

# A newer push supersedes an older run on the same branch.
concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test on the simulator
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The runner image decides which Xcode exists. Select the newest rather than
      # pinning a version this repository cannot verify, and print it so a failure
      # caused by a toolchain change is visible in the log rather than inferred.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          swift --version

      # A device name is ambiguous: the same iPhone exists under several runtimes,
      # and xcodebuild refuses a destination it cannot resolve to one device. Ask
      # xcodebuild itself which destinations it accepts and take a UDID, which is
      # unique.
      - name: Choose an available iOS simulator
        id: sim
        working-directory: ios
        run: |
          xcodebuild -project BalloonHunter.xcodeproj -scheme BalloonHunter \
            -showdestinations 2>/dev/null | grep "platform:iOS Simulator" || true
          DEST_ID=$(xcodebuild -project BalloonHunter.xcodeproj -scheme BalloonHunter \
            -showdestinations 2>/dev/null \
            | grep "platform:iOS Simulator" | grep "name:iPhone" | grep -v placeholder \
            | sed -n 's/.*id:\([0-9A-Fa-f-]*\),.*/\1/p' | head -1)
          if [ -z "$DEST_ID" ]; then
            echo "::error::No iPhone simulator destination available on this runner"
            exit 1
          fi
          echo "Using simulator id: $DEST_ID"
          echo "id=$DEST_ID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project BalloonHunter.xcodeproj \
            -scheme BalloonHunter \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build test

      # The bundle carries which test failed and why; without it a red run means
      # re-running locally to find out.
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ios/TestResults.xcresult
          retention-days: 14
