[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balloonhunter-sim"
version = "0.1.0"
description = "Balloon flight and telemetry simulation for BalloonHunter"
requires-python = ">=3.11"
# Stdlib only at runtime: a collector that must run unattended for months should
# not carry dependencies it does not need.
dependencies = []

[project.scripts]
sonde-collector = "balloonhunter_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
