# BalloonHunter - test plan
#
# Generated from the clause inventory in clauses.yaml. Every test names the
# clauses it discharges, the capabilities it needs, and what it last produced.
#
# status is one of:
#   successful   it ran and passed, including its must_not checks
#   failed       it ran and did not
#   not done     no result - the reason field says which of the four problems it is
#
# Blocked is computed, never typed: a test needing a capability marked
# available: no renders as blocked, with the reason, in testing/STATUS.md.
#
# Regenerate the report with testing/report.sh.

capabilities:
  bench:
    what: "A Mac with Xcode. No hardware, no network, no sonde."
    available: "yes"
    how: "Always available; this is the pre-push gate."
  simulator:
    what: "An iOS simulator, for UI tests that need no radio."
    available: "yes"
    how: "Booted by testing/ui-cycle.sh."
    limits: "No CoreBluetooth: the simulator can never exercise the receiver, so every BLE clause needs the phone."
  iphone:
    what: "The hunter's iPhone with the app installed, driven from the terminal."
    available: "yes"
    how: "testing/ui-cycle.sh --device; xcodebuild needs the hardware id, not the devicectl UUID."
    limits: "XCUITest terminates the app under test at teardown; ui-cycle.sh relaunches it afterwards."
  receiver:
    what: "A MySondyGo powered, in range and connected over BLE."
    available: "yes"
    how: "Switch it on within range; the app connects by itself."
  receiver-retune:
    what: "Changing the receiver's frequency on demand, to take a sonde signal away or give it back."
    available: "on-demand"
    how: "Turn the knob on the receiver, or accept a frequency-sync proposal in the app."
    limits: "Using it during a live flight costs the campaign its BLE phases, so it is held back while a flight is in progress."
  sondehub:
    what: "SondeHub reachable, with at least one sonde for the station in the last 24 h."
    available: "yes"
    how: "Normal network."
  second-sonde:
    what: "Two sondes in the picker, so a change has somewhere to go."
    available: "yes"
    how: "Payerne usually lists two."
  sonde-flying:
    what: "A sonde airborne now."
    available: "yes"
    how: "Wait for a launch; Payerne flies to a schedule."
    limits: "Opportunistic - a missed phase is missed for that flight."
  sonde-descending:
    what: "A sonde after burst, falling."
    available: "no"
    how: "Wait for the burst of a flight already being tracked."
    limits: "The one stage that cannot be arranged at all."
  sonde-landed:
    what: "A sonde down and still lying out, its flight on SondeHub."
    available: "no"
    how: "Wait for a flight to end within reach."
  sonde-refrequency:
    what: "A sonde whose reported frequency changes mid-flight."
    available: "no"
    how: "Not arrangeable; watch for one."
  test-sonde:
    what: "A repowered bench sonde transmitting, absent from SondeHub."
    available: "no"
    how: "Power the bench unit and tune the receiver to it."
  network-outage:
    what: "Taking SondeHub away and giving it back."
    available: "on-demand"
    how: "Airplane mode on the phone - a person can do it, and a prompt can wait for them."
  hunter-driving:
    what: "The hunter actually moving between towns."
    available: "on-demand"
    how: "A drive. Cannot be simulated: the route renewal rules key on real movement."
  hunter-on-foot:
    what: "The hunter walking the last stretch to the sonde."
    available: "on-demand"
    how: "Being at the landing site."

tests:
