      - FSD-PHASE-vector
      - FSD-PHASE-ascend-descend
      - FSD-LAND-touchdown-observed
      - FSD-LAND-blackout
      - FSD-LAND-stationary
      - FSD-LAND-detect-when
    criteria:
      given: "A track fixture"
      when: "LandingDetector judges it"
      then: "the priority chain holds and confirmsTouchdown is true only for a fixed near-ground observation"
      must_not:
        - "A touchdown confirmed from APRS silence"
    implemented_by: "LandingDetectorTests, LandingSequenceTests"
    evidence: "49 assertions passing"
    last_run: "2026-08-22"
    status: "successful"
  - id: U-PREDICTION-POLICY
