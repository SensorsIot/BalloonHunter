      when: "PredictionPolicy decides"
      then: "all four rows and both boundaries hold"
      must_not:
        - "A second prediction in landed-by-silence once an estimate exists"
        - "Any prediction after a confirmed touchdown"
    implemented_by: "LandingSequenceTests"
    evidence: "passing; mutation-checked"
    last_run: "2026-08-22"
    status: "successful"
